<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本生成视频</title>
    <style>
      :root {
        --bg: #f5f2eb;
        --panel: #ffffff;
        --line: #ded8ce;
        --text: #171717;
        --muted: #706a60;
        --soft: #eee9df;
        --dark: #171717;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Microsoft YaHei", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      textarea,
      input,
      select {
        font: inherit;
      }

      .page {
        width: min(100% - 36px, 1260px);
        margin: 0 auto;
        padding: 28px 0;
        display: grid;
        gap: 16px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.12;
        font-weight: 760;
      }

      .sub {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 11px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(560px, 1fr) minmax(390px, 470px);
        gap: 16px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }

      .section {
        padding: 16px;
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 10px;
      }

      .section:last-child {
        border-bottom: 0;
      }

      .bar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #8a8278;
        font-size: 12px;
      }

      textarea {
        width: 100%;
        height: 260px;
        resize: vertical;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        line-height: 1.75;
      }

      input,
      select {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 11px;
        background: #fff;
        outline: none;
      }

      label {
        display: grid;
        gap: 6px;
        color: #81796e;
        font-size: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      button {
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 14px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        font-weight: 650;
      }

      button.primary {
        background: var(--dark);
        border-color: var(--dark);
        color: #fff;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .output {
        position: sticky;
        top: 18px;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #111;
        border-radius: 12px;
      }

      .status {
        min-height: 42px;
        padding: 11px 12px;
        border-radius: 12px;
        background: var(--soft);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      a.button {
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 9px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        text-decoration: none;
        background: #fff;
        font-size: 13px;
        font-weight: 650;
      }

      pre {
        margin: 0;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        color: #575047;
        font-size: 12px;
        line-height: 1.55;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 1020px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .output {
          position: static;
        }
      }

      @media (max-width: 620px) {
        .page {
          width: min(100% - 24px, 1260px);
          padding: 18px 0;
        }

        header,
        .grid,
        .actions,
        .links {
          grid-template-columns: 1fr;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div>
          <h1>文本生成视频</h1>
          <p class="sub">输入文案，一站式生成旁白、自动镜头时间轴，并用 Remotion 渲染视频。</p>
        </div>
        <span class="pill" id="connection">Remotion 模板生成台</span>
      </header>

      <div class="workspace">
        <section class="panel">
          <div class="section">
            <div class="bar">
              <span>文案</span>
              <span id="count">0 字</span>
            </div>
            <textarea id="text">旅顺港的海风吹进东京霞关，战争的尾声并没有带来平静。新的铁路和港口，正在改变东亚的权力地图。</textarea>
          </div>

          <div class="section">
            <div class="grid">
              <label>
                生成模式
                <select id="mode">
                  <option value="auto-scenes">自动镜头：文本 → 语音 → 镜头 → 成片</option>
                  <option value="single-template">单模板：文本 → 语音 → 当前模板</option>
                </select>
              </label>
              <label>
                标题
                <input id="title" value="南满铁路的开端" />
              </label>
            </div>
            <div class="grid">
              <label>
                副标题
                <input id="subtitle" value="文本生成旁白与历史地图视频" />
              </label>
              <label>
                Remotion 模板
                <select id="template">
                  <option value="DocumentReveal">历史文件揭示</option>
                  <option value="QuoteReveal">引文揭示</option>
                  <option value="PortraitFocus">人物身份卡</option>
                  <option value="ConceptDiagram">概念关系图</option>
                  <option value="MetaphorVisual">隐喻可视化</option>
                  <option value="FootageScene">本地素材片段</option>
                  <option value="SinoJapaneseWarDemo">中日战争历史地球</option>
                  <option value="HistoricalGlobeTexture1938">1938 历史地球纹理</option>
                  <option value="AtlasMapFlyover">世界地图飞越</option>
                  <option value="MapRouteFlyover">路线地图飞越</option>
                  <option value="ThreeProductStage">三维产品舞台</option>
                  <option value="ThreeParticleNebula">三维粒子星云</option>
                  <option value="ThreeCardCascade">三维卡片级联</option>
                  <option value="ThreeBouncingSpheres">三维弹跳球</option>
                  <option value="ClaudeTyper">命令行打字机</option>
                  <option value="SpotlightReveal">聚光灯揭示</option>
                  <option value="ProceduralFish">程序鱼群</option>
                  <option value="RulerProgress">进度尺</option>
                  <option value="SvgAssembly">SVG 组装</option>
                  <option value="Wechat2D">微信对话</option>
                  <option value="ThreeDTicker">3D 色块滚动</option>
                  <option value="VinylPlayer">黑胶播放器</option>
                  <option value="PromptTextRotation">提示词文本轮播</option>
                  <option value="PromptProgressBar">提示词进度条</option>
                  <option value="PromptHistogram">提示词柱状图</option>
                  <option value="PromptAnimatedShapes">提示词动态图形</option>
                </select>
              </label>
            </div>
            <p class="sub" id="modeNote">自动镜头模式会忽略“Remotion 模板”，系统会按文案语义自动选择多个镜头模板。</p>
            <label>
              语音指令
              <input id="instruction" value="标准播音风格，吐字清晰，语速平稳，停顿自然" />
            </label>
            <div class="grid">
              <label>
                视觉风格
                <select id="theme">
                  <option value="historical">历史地图</option>
                  <option value="clean">干净浅色</option>
                </select>
              </label>
              <label>
                字幕
                <select id="skipSrt">
                  <option value="false">生成 SRT</option>
                  <option value="true">跳过字幕，更快</option>
                </select>
              </label>
            </div>
          </div>

          <div class="section">
            <div class="actions">
              <button class="primary" id="generate">一站式生成视频</button>
              <button id="reset">重置</button>
            </div>
          </div>
        </section>

        <aside class="panel output">
          <div class="section">
            <div class="bar">
              <span>输出</span>
              <span id="state">等待生成</span>
            </div>
            <video id="video" controls></video>
            <div class="status" id="status">还没有任务。</div>
            <div class="links hidden" id="links">
              <a class="button" id="open" target="_blank" rel="noreferrer">打开视频</a>
              <a class="button" id="download" download>下载视频</a>
            </div>
          </div>
          <div class="section">
            <div class="bar">
              <span>日志</span>
              <span id="jobId">无任务</span>
            </div>
            <pre id="logs">生成过程会显示在这里。</pre>
          </div>
        </aside>
      </div>
    </main>

    <script>
      const $ = (selector) => document.querySelector(selector);
      let activeJob = "";
      let timer = null;

      function count() {
        $("#count").textContent = `${$("#text").value.trim().length} 字`;
      }

      function setBusy(value) {
        $("#generate").disabled = value;
        $("#generate").textContent = value ? "生成中" : "生成视频";
      }

      async function readJson(res) {
        const payload = await res.json().catch(() => null);
        if (!res.ok || !payload?.success) {
          throw new Error(payload?.error || `HTTP ${res.status}`);
        }
        return payload.data;
      }

      async function createJob() {
        const text = $("#text").value.trim();
        if (!text) {
          $("#status").textContent = "请输入文案。";
          return;
        }

        setBusy(true);
        $("#state").textContent = "提交中";
        $("#status").textContent = "正在提交生成任务。";
        $("#logs").textContent = "";
        $("#links").classList.add("hidden");
        $("#video").removeAttribute("src");

        try {
          const res = await fetch("/api/jobs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              title: $("#title").value.trim(),
              subtitle: $("#subtitle").value.trim(),
              instruction: $("#instruction").value.trim(),
              mode: $("#mode").value,
              template: $("#template").value,
              theme: $("#theme").value,
              skipSrt: $("#skipSrt").value === "true",
            }),
          });
          const job = await readJson(res);
          activeJob = job.id;
          $("#jobId").textContent = job.id;
          pollJob();
          timer = setInterval(pollJob, 2000);
        } catch (error) {
          setBusy(false);
          $("#state").textContent = "失败";
          $("#status").textContent = error.message || String(error);
        }
      }

      async function pollJob() {
        if (!activeJob) return;
        try {
          const res = await fetch(`/api/jobs/${encodeURIComponent(activeJob)}`);
          const job = await readJson(res);
          $("#state").textContent = job.status;
          $("#status").textContent = job.error || job.progress || job.status;
          $("#logs").textContent = (job.logs || []).join("\n") || "等待日志。";
          $("#logs").scrollTop = $("#logs").scrollHeight;

          if (job.status === "succeeded") {
            clearInterval(timer);
            setBusy(false);
            const url = job.result.videoUrl;
            $("#video").src = url;
            $("#open").href = url;
            $("#download").href = url;
            $("#links").classList.remove("hidden");
            $("#status").textContent = "视频已生成。";
          }

          if (job.status === "failed") {
            clearInterval(timer);
            setBusy(false);
          }
        } catch (error) {
          clearInterval(timer);
          setBusy(false);
          $("#state").textContent = "失败";
          $("#status").textContent = error.message || String(error);
        }
      }

      $("#text").addEventListener("input", count);
      $("#mode").addEventListener("change", () => {
        const auto = $("#mode").value === "auto-scenes";
        $("#template").disabled = auto;
        $("#modeNote").textContent = auto
          ? "自动镜头模式会忽略“Remotion 模板”，系统会按文案语义自动选择多个镜头模板。"
          : "单模板模式会使用下方选中的 Remotion 模板，适合固定视觉风格。";
        $("#generate").textContent = auto ? "一站式生成视频" : "生成当前模板视频";
      });
      $("#generate").addEventListener("click", createJob);
      $("#reset").addEventListener("click", () => {
        $("#text").value = "";
        count();
      });
      count();
      $("#mode").dispatchEvent(new Event("change"));
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频项目编辑器</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #171717;
        font-family: Inter, "Microsoft YaHei", Arial, sans-serif;
      }
      button, input, textarea, select { font: inherit; }
      .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
      header {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 18px;
        border-bottom: 1px solid #deded9;
        background: rgba(255,255,255,0.88);
        backdrop-filter: blur(12px);
      }
      h1 { margin: 0; font-size: 17px; font-weight: 800; }
      .muted { color: #737373; font-size: 12px; }
      .main {
        display: grid;
        grid-template-columns: 290px minmax(360px, 1fr) 340px;
        gap: 12px;
        padding: 12px;
        min-height: 0;
      }
      .panel {
        background: #fff;
        border: 1px solid #dfdfda;
        border-radius: 12px;
        overflow: hidden;
        min-height: 0;
      }
      .panel-head {
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        border-bottom: 1px solid #ecece8;
        font-size: 13px;
        font-weight: 800;
      }
      .scenes { overflow: auto; height: calc(100vh - 174px); padding: 8px; }
      .scene {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 9px;
        background: #f7f7f4;
        padding: 10px;
        margin-bottom: 8px;
        text-align: left;
        cursor: pointer;
      }
      .scene.active { border-color: #171717; background: #fff; }
      .scene-title { font-size: 13px; font-weight: 800; line-height: 1.4; }
      .scene-meta { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
      .tag { border-radius: 999px; background: #e9e9e4; color: #555; padding: 3px 7px; font-size: 11px; }
      .preview-wrap { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
      .preview {
        margin: 12px;
        border-radius: 12px;
        background: #111;
        min-height: 360px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      video { width: 100%; height: 100%; max-height: calc(100vh - 226px); object-fit: contain; background: #000; }
      .empty { color: #aaa; font-size: 13px; }
      .form { padding: 12px; overflow: auto; height: calc(100vh - 174px); }
      label { display: block; font-size: 12px; color: #666; margin: 0 0 10px; }
      input, textarea, select {
        margin-top: 5px;
        width: 100%;
        border: 1px solid #d9d9d3;
        border-radius: 9px;
        background: #fbfbf8;
        padding: 9px 10px;
        outline: none;
      }
      textarea { min-height: 86px; resize: vertical; line-height: 1.5; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
      button {
        border: 1px solid #d6d6d0;
        background: #fff;
        border-radius: 9px;
        padding: 8px 11px;
        cursor: pointer;
      }
      button.primary { background: #171717; color: #fff; border-color: #171717; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .candidate {
        border: 1px solid #e2e2dd;
        border-radius: 10px;
        padding: 9px;
        margin-bottom: 8px;
        background: #fafaf7;
      }
      .candidate strong { display: block; font-size: 13px; margin-bottom: 4px; }
      footer {
        border-top: 1px solid #deded9;
        background: #fff;
        padding: 10px 12px;
      }
      .timeline {
        display: flex;
        align-items: stretch;
        gap: 4px;
        height: 58px;
        overflow-x: auto;
      }
      .block {
        min-width: 82px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #efefe9;
        padding: 7px;
        font-size: 11px;
        cursor: pointer;
      }
      .block.active { background: #171717; color: #fff; }
      @media (max-width: 1060px) {
        .main { grid-template-columns: 1fr; }
        .scenes, .form { height: auto; max-height: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1 id="title">视频项目编辑器</h1>
          <div class="muted" id="status">正在载入项目...</div>
        </div>
        <div class="actions">
          <a id="openVideo" target="_blank" rel="noreferrer"><button type="button">打开视频</button></a>
          <button class="primary" id="exportBtn" type="button">总导出</button>
        </div>
      </header>
      <main class="main">
        <section class="panel">
          <div class="panel-head"><span>分镜</span><span id="count"></span></div>
          <div class="scenes" id="scenes"></div>
        </section>
        <section class="panel preview-wrap">
          <div class="panel-head"><span>预览</span><span id="previewMeta" class="muted"></span></div>
          <div class="preview" id="preview"></div>
        </section>
        <aside class="panel">
          <div class="panel-head"><span>当前分镜</span><span id="lockState" class="muted"></span></div>
          <div class="form" id="editor"></div>
        </aside>
      </main>
      <footer>
        <div class="timeline" id="timeline"></div>
      </footer>
    </div>

    <script>
      const projectId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
      let project = null;
      let selectedSceneId = "";
      let candidates = [];

      const $ = (id) => document.getElementById(id);

      async function api(path, options = {}) {
        const res = await fetch(path, {
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
        const payload = await res.json();
        if (!payload.success) throw new Error(payload.error || "请求失败");
        return payload.data;
      }

      async function load() {
        project = await api(`/api/projects/${encodeURIComponent(projectId)}`);
        selectedSceneId = selectedSceneId || project.scenes[0]?.id || "";
        render();
      }

      function render() {
        $("title").textContent = project.title || "视频项目";
        $("status").textContent = `${project.scenes.length} 个分镜 · ${project.history.length} 次操作`;
        $("count").textContent = project.scenes.length;
        $("openVideo").href = project.videoUrl || "#";
        renderScenes();
        renderPreview();
        renderEditor();
        renderTimeline();
      }

      function currentScene() {
        return project.scenes.find((scene) => scene.id === selectedSceneId) || project.scenes[0];
      }

      function renderScenes() {
        $("scenes").innerHTML = project.scenes.map((scene, index) => `
          <button class="scene ${scene.id === selectedSceneId ? "active" : ""}" data-id="${scene.id}">
            <div class="scene-title">${index + 1}. ${escapeHtml(scene.subtitle || scene.voiceText).slice(0, 54)}</div>
            <div class="scene-meta">
              <span class="tag">${scene.sceneType}</span>
              <span class="tag">${scene.templateId}</span>
              ${scene.locked ? '<span class="tag">已锁定</span>' : ""}
            </div>
          </button>
        `).join("");
        document.querySelectorAll(".scene").forEach((el) => el.onclick = () => selectScene(el.dataset.id));
      }

      function renderPreview() {
        const scene = currentScene();
        $("previewMeta").textContent = scene ? `${ms(scene.startMs)} - ${ms(scene.endMs)}` : "";
        if (project.videoUrl) {
          $("preview").innerHTML = `<video controls src="${project.videoUrl}"></video>`;
        } else {
          $("preview").innerHTML = '<div class="empty">项目还没有导出视频</div>';
        }
      }

      function renderEditor() {
        const scene = currentScene();
        if (!scene) {
          $("editor").innerHTML = '<div class="empty">没有分镜</div>';
          return;
        }
        $("lockState").textContent = scene.locked ? "已锁定" : "可编辑";
        $("editor").innerHTML = `
          <label>旁白文本<textarea id="voiceText">${escapeTextarea(scene.voiceText)}</textarea></label>
          <label>字幕/画面文案<textarea id="subtitleText">${escapeTextarea(scene.subtitle)}</textarea></label>
          <div class="row">
            <label>开始 ms<input id="startMs" type="number" value="${Math.round(scene.startMs)}" /></label>
            <label>结束 ms<input id="endMs" type="number" value="${Math.round(scene.endMs)}" /></label>
          </div>
          <div class="row">
            <label>模板<input id="templateId" value="${escapeHtml(scene.templateId)}" /></label>
            <label>类型<input id="sceneType" value="${escapeHtml(scene.sceneType)}" /></label>
          </div>
          <label>视觉意图<textarea id="visualIntent">${escapeTextarea(scene.visualIntent || "")}</textarea></label>
          <label>素材层<input id="visualLayer" value="${escapeHtml(scene.visualLayer?.path || scene.visualLayer?.templateId || scene.visualLayer?.type || "")}" readonly /></label>
          <div class="actions">
            <button class="primary" id="saveScene">保存分镜</button>
            <button id="lockScene">${scene.locked ? "解除锁定" : "锁定分镜"}</button>
            <button id="rematch">重配当前素材</button>
            <button id="up">上移</button>
            <button id="down">下移</button>
          </div>
          <div id="candidates">${renderCandidates()}</div>
        `;
        $("saveScene").onclick = saveScene;
        $("lockScene").onclick = toggleLock;
        $("rematch").onclick = rematch;
        $("up").onclick = () => moveScene(-1);
        $("down").onclick = () => moveScene(1);
      }

      function renderCandidates() {
        if (!candidates.length) return '<div class="muted">点击“重配当前素材”后显示候选素材。</div>';
        return candidates.map((item) => `
          <div class="candidate">
            <strong>${escapeHtml(item.title || item.id)}</strong>
            <div class="muted">${escapeHtml(item.reason || "")} · 分数 ${item.score}</div>
            <div class="muted">${escapeHtml(item.path || "")}</div>
            <button data-candidate="${item.id}">替换为该素材</button>
          </div>
        `).join("");
      }

      function renderTimeline() {
        $("timeline").innerHTML = project.scenes.map((scene, index) => {
          const width = Math.max(82, Math.round((scene.endMs - scene.startMs) / 35));
          return `<button class="block ${scene.id === selectedSceneId ? "active" : ""}" style="width:${width}px" data-id="${scene.id}">
            ${index + 1}<br>${ms(scene.startMs)}-${ms(scene.endMs)}
          </button>`;
        }).join("");
        document.querySelectorAll(".block").forEach((el) => el.onclick = () => selectScene(el.dataset.id));
      }

      async function saveScene() {
        const scene = currentScene();
        const patch = {
          voiceText: $("voiceText").value,
          subtitle: $("subtitleText").value,
          startMs: Number($("startMs").value),
          endMs: Number($("endMs").value),
          templateId: $("templateId").value,
          sceneType: $("sceneType").value,
          visualIntent: $("visualIntent").value,
          props: { body: $("subtitleText").value },
        };
        project = await api(`/api/projects/${project.id}/scenes/${scene.id}`, {
          method: "PATCH",
          body: JSON.stringify({ patch }),
        });
        render();
      }

      async function toggleLock() {
        const scene = currentScene();
        project = await api(`/api/projects/${project.id}/scenes/${scene.id}/lock`, {
          method: "POST",
          body: JSON.stringify({ locked: !scene.locked }),
        });
        render();
      }

      async function rematch() {
        const scene = currentScene();
        const data = await api(`/api/projects/${project.id}/scenes/${scene.id}/rematch-material`, { method: "POST" });
        candidates = data.candidates || [];
        renderEditor();
        document.querySelectorAll("[data-candidate]").forEach((el) => {
          el.onclick = () => replaceMaterial(candidates.find((item) => item.id === el.dataset.candidate));
        });
      }

      async function replaceMaterial(candidate) {
        const scene = currentScene();
        project = await api(`/api/projects/${project.id}/scenes/${scene.id}/replace-material`, {
          method: "POST",
          body: JSON.stringify({ candidate }),
        });
        candidates = [];
        render();
      }

      async function moveScene(offset) {
        const ids = project.scenes.map((scene) => scene.id);
        const index = ids.indexOf(selectedSceneId);
        const next = index + offset;
        if (next < 0 || next >= ids.length) return;
        [ids[index], ids[next]] = [ids[next], ids[index]];
        project = await api(`/api/projects/${project.id}/reorder`, {
          method: "POST",
          body: JSON.stringify({ sceneIds: ids }),
        });
        render();
      }

      async function exportProject() {
        $("exportBtn").disabled = true;
        $("exportBtn").textContent = "导出中";
        try {
          project = await api(`/api/projects/${project.id}/export`, { method: "POST" });
          render();
        } finally {
          $("exportBtn").disabled = false;
          $("exportBtn").textContent = "总导出";
        }
      }

      function selectScene(id) {
        selectedSceneId = id;
        candidates = [];
        render();
      }

      function ms(value) {
        const total = Math.max(0, Math.round(Number(value || 0)));
        const sec = Math.floor(total / 1000);
        const m = Math.floor(sec / 60);
        const s = String(sec % 60).padStart(2, "0");
        return `${m}:${s}`;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
      }

      function escapeTextarea(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      $("exportBtn").onclick = exportProject;
      load().catch((error) => {
        $("status").textContent = error.message;
        $("preview").innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      });
    </script>
  </body>
</html>
